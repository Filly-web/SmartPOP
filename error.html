<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POP Portal Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#edf2f8}.login{max-width:420px;margin:9vh auto}.card{border:0;border-radius:16px;box-shadow:0 12px 35px #19395b18}.brand{background:#102b4e;color:white;border-radius:14px 14px 0 0;padding:25px}</style></head><body><div class="login card"><div class="brand"><h4 class="mb-1">BRITAM POP MANAGEMENT</h4><div class="small opacity-75">Proof of Payment · Sample Portal</div></div><div class="p-4">{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="alert alert-{{c}}">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><label class="form-label">Username</label><input class="form-control mb-3" name="username" required><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required><button class="btn btn-primary w-100">Sign in</button></form><hr><div class="small text-secondary"><b>Demo cashier:</b> cashier / Cashier123!<br><b>Demo submitter:</b> agency1 / Agency123!</div></div></div></body></html>
