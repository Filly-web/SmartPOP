{% extends "base.html" %}{% block content %}<h4 class="mb-1">Submit proof of payment</h4><p class="muted mb-4">Customer name, policy number, amount and POP attachment are required.</p><div class="card p-4"><form method="post" enctype="multipart/form-data"><div class="row g-3">
<div class="col-md-6"><label class="form-label">Customer name *</label><input class="form-control" name="customer_name" required></div>
<div class="col-md-6"><label class="form-label">Policy number *</label><input class="form-control" name="policy_number" required></div>
<div class="col-md-4"><label class="form-label">Amount *</label><input class="form-control" type="number" step="0.01" min="0.01" name="amount" required></div>
<div class="col-md-4"><label class="form-label">Policy type (optional)</label><select class="form-select" name="policy_type"><option value="">Select policy type</option>{% for t in ['Motor Vehicle','Medical','General','Fire','Marine','Engineering','Other'] %}<option>{{t}}</option>{% endfor %}</select></div>
<div class="col-md-4"><label class="form-label">Debit note number (optional)</label><input class="form-control" name="debitnote_number"></div>
<div class="col-12"><label class="form-label">Proof of payment attachment *</label><input class="form-control" type="file" name="pop_file" accept=".pdf,.png,.jpg,.jpeg" required><div class="form-text">PDF, JPG or PNG · Maximum 16 MB</div></div>
</div><div class="mt-4 d-flex gap-2"><button class="btn btn-primary">Submit POP</button><a class="btn btn-light" href="/submitter">Cancel</a></div></form></div>{% endblock %}
