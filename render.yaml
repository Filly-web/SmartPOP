services:
  - type: web
    name: britam-pop-management-portal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --timeout 120 app:app
    plan: standard
    disk:
      name: pop-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: POP_SECRET_KEY
        generateValue: true
      - key: POP_DATABASE_URL
        sync: false
      - key: POP_UPLOAD_DIR
        value: /var/data/pop-uploads
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_NAME
        value: POP Portal Administrator
