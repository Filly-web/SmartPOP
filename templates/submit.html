{% extends 'base.html' %}{% block content %}<div class="eyebrow">NEW SUBMISSION</div><h2>Submit proof of payment</h2><p class="text-muted mb-4">Enter the policy details and attach the payment evidence. Fields marked * are mandatory.</p><form method="post" enctype="multipart/form-data" class="panel form-panel"><div class="row g-3"><div class="col-md-6"><label class="form-label">Customer name *</label><input class="form-control" name="customer_name" required maxlength="200"></div><div class="col-md-6"><label class="form-label">Policy number *</label><input class="form-control" name="policy_number" required maxlength="100"></div><div class="col-md-6"><label class="form-label">Amount *</label><input class="form-control" type="number" name="amount" min="0.01" step="0.01" required></div><div class="col-md-6"><label class="form-label">Policy type</label><select class="form-select" name="policy_type"><option value="">Select if applicable</option>{% for x in ['Motor Vehicle','Medical','General','Fire','Marine','Engineering','Personal Accident','Other'] %}<option>{{ x }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Debit note number</label><input class="form-control" name="debitnote_number"></div><div class="col-md-6"><label class="form-label">POP attachment *</label><input class="form-control" type="file" name="pop_file" accept=".pdf,.png,.jpg,.jpeg" required><div class="form-text">PDF, JPG or PNG · Maximum 16 MB</div></div><div class="col-12"><label class="form-label">Additional note</label><textarea class="form-control" name="submitter_note" rows="3"></textarea></div></div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-light" href="{{ url_for('dashboard') }}">Cancel</a><button class="btn btn-primary">Submit POP</button></div></form>{% endblock %}
